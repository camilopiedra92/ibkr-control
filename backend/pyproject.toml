[project]
name = "ibkr-control-backend"
version = "0.1.0"
description = "IBKR Control Center backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "fastapi-users[sqlalchemy]>=14.0.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "cryptography>=42.0",
    "httpx>=0.27",
    "lxml>=5.2",
    "sse-starlette>=2.1",
    "apscheduler==3.11.*",
    "psycopg[binary]>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "testcontainers[postgres]>=4.8.0",
    "ruff>=0.8.0",
    "psycopg2-binary>=2.9.12",
    "vcrpy>=6.0",
    "respx>=0.21",
    "pytest-vcr>=1.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Paralelo por defecto (local + CI). Override para debug/medición serial: -n0.
# Tope opcional de workers via env PYTEST_XDIST_AUTO_NUM_WORKERS (no pin numérico:
# con aislamiento real por test, el worker-count no afecta correctitud, solo
# velocidad — pinear envejece cuando GitHub cambia los runners).
addopts = ["-n", "auto"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ibkr_control"]
