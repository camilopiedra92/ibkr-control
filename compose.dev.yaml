# Override de desarrollo. Se aplica encima de compose.yaml via:
#   docker compose -f compose.yaml -f compose.dev.yaml up -d
# (envuelto por `make dev` — preferir el Makefile.)
#
# Diferencias clave vs prod:
#   - target: dev en ambos Dockerfiles (incluye dev deps + watchers)
#   - source bind-montado para hot reload
#   - backend: uvicorn --reload --reload-dir src
#   - frontend: next dev con HMR nativo
#   - frontend node_modules + .next como named volumes anónimos para que el
#     host NO los pise (sino crashea: el host puede no tener pnpm install local)
#
# File-system performance en macOS:
#   Asumimos Docker Desktop ≥4.6 con VirtioFS activo (Settings → General →
#   "Choose file sharing implementation" → VirtioFS). VirtioFS propaga
#   fsevents al container nativamente, así que NO necesitamos polling.
#
#   Si por alguna razón tenés gRPC-FUSE (legacy) y HMR no detecta cambios,
#   agregá al servicio frontend:
#     environment:
#       WATCHPACK_POLLING: "true"
#       CHOKIDAR_USEPOLLING: "true"
#   Polling cuesta ~1-3% CPU constante; preferí activar VirtioFS antes.

services:
  backend:
    build:
      target: dev
    volumes:
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/tests:/app/tests
      - ./backend/scripts:/app/scripts
      - ./backend/pyproject.toml:/app/pyproject.toml
      - ./backend/uv.lock:/app/uv.lock
    environment:
      # Dev-only flags. CORS abierto a localhost:3000 para HMR del frontend.
      LOG_LEVEL: DEBUG

  frontend:
    build:
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      # TEMP: polling vars removed for VirtioFS test
      NEXT_PUBLIC_API_URL: http://localhost:8000
